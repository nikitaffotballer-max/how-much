services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: howmuch
      POSTGRES_PASSWORD: howmuch
      POSTGRES_DB: howmuch
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U howmuch']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  postgres-data:
