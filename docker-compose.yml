services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: howmuch
      POSTGRES_PASSWORD: howmuch
      POSTGRES_DB: howmuch
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U howmuch']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Тестовый IMAP-сервер для интеграционных тестов почты: docker compose --profile test up -d
  # Пускает любой логин с паролем app-password; письма живут только до перезапуска контейнера.
  imap-test:
    image: dovecot/dovecot:2.4.1
    profiles: ['test']
    environment:
      USER_PASSWORD: app-password
    ports:
      - '31993:31993'

volumes:
  postgres-data:
