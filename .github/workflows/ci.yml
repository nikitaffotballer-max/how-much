name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Тесты API и воркера работают с настоящей базой, тесты почты — с настоящим IMAP-сервером.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: howmuch
          POSTGRES_PASSWORD: howmuch
          POSTGRES_DB: howmuch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U howmuch"
          --health-interval 5s
          --health-retries 10
      imap:
        image: dovecot/dovecot:2.4.1
        env:
          USER_PASSWORD: app-password
        ports:
          - 31993:31993

    env:
      DATABASE_URL: postgresql://howmuch:howmuch@localhost:5432/howmuch
      IMAP_TEST_PORT: 31993

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      # Справочник категорий нужен тестам аналитики и разбора чеков.
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
